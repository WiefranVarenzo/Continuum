[workspace]
members = ["crates/continuum-core", "crates/continuum-mcp"]
exclude = ["apps/continuum-desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
ast-grep-core = "=0.45.3"
ast-grep-language = { version = "=0.45.3", default-features = false, features = ["tree-sitter-javascript", "tree-sitter-json", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-typescript"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.38", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "=1.1.5"
uuid = { version = "1", features = ["serde", "v7"] }
